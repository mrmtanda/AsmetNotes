<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AsmetNotes</title>
  <script>
    (function () {
      try {
        var tokenKey = "sb-gudoctpbbejzytbpldiv-auth-token";
        var raw = localStorage.getItem(tokenKey);
        var target = "simple-notes/auth.html";
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.access_token) {
            target = "simple-notes/index.html";
          }
        }
        window.location.replace(target + window.location.search + window.location.hash);
      } catch (e) {
        window.location.replace("simple-notes/auth.html");
      }
    })();
  </script>
</head>
<body style="font-family: 'Inter', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #090d16; color: #f8fafc;">
  <p style="font-size: 0.9375rem; color: #94a3b8;">Redirecting to AsmetNotes...</p>
</body>
</html>
