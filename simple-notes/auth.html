<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In &bull; AsmetNotes</title>
  
  <!-- Immediate Auth Guard: If already authenticated, redirect straight to dashboard -->
  <script>
    (function () {
      try {
        var tokenKey = "sb-gudoctpbbejzytbpldiv-auth-token";
        var raw = localStorage.getItem(tokenKey);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.access_token) {
            window.location.replace("index.html" + window.location.search + window.location.hash);
          }
        }
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    /* ========================================================
       Ultra-Modern SaaS Auth Experience
       ======================================================== */
    :root {
      --auth-mesh-glow: radial-gradient(ellipse 80% 50% at 50% -15%, rgba(79, 70, 229, 0.12), transparent 70%);
      --auth-dot-pattern: radial-gradient(rgba(15, 23, 42, 0.05) 1px, transparent 1px);
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(226, 232, 240, 0.85);
      --card-shadow: 0 0 0 1px rgba(226, 232, 240, 0.8), 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 35px -5px rgba(79, 70, 229, 0.06);
      --input-bg: #f8fafc;
      --input-border: #e2e8f0;
      --input-focus-border: #6366f1;
      --input-focus-ring: rgba(99, 102, 241, 0.18);
    }

    [data-theme="dark"] {
      --auth-mesh-glow: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.22), transparent 70%);
      --auth-dot-pattern: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      --card-bg: rgba(17, 24, 39, 0.82);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 50px -10px rgba(99, 102, 241, 0.15);
      --input-bg: rgba(15, 23, 42, 0.65);
      --input-border: rgba(255, 255, 255, 0.12);
      --input-focus-border: #818cf8;
      --input-focus-ring: rgba(129, 140, 248, 0.25);
    }

    body.auth-view {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--color-bg);
      background-image: var(--auth-mesh-glow), var(--auth-dot-pattern);
      background-size: 100% 100%, 24px 24px;
      background-repeat: no-repeat, repeat;
      color: var(--color-text-body);
      font-family: var(--font-family);
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background Light Blob */
    .auth-ambient-blur {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 620px;
      height: 380px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.1) 45%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    /* Sleek Frosted Header */
    .auth-top-nav {
      position: relative;
      z-index: 10;
      height: 64px;
      padding: 0 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background-color: rgba(var(--color-surface), 0.6);
    }

    .auth-brand-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
    }

    .auth-brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
    }

    .auth-brand-logo svg {
      width: 18px;
      height: 18px;
    }

    .auth-brand-text {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .auth-brand-text .brand-asmet {
      color: var(--color-primary);
    }

    .auth-brand-text .brand-notes {
      color: var(--color-text-heading);
    }

    .auth-nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .auth-theme-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--color-surface);
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .auth-theme-btn:hover {
      color: var(--color-primary);
      border-color: var(--color-primary);
      transform: translateY(-1px);
    }

    /* Main Center Stage */
    .auth-center-stage {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem 3.5rem;
    }

    .auth-container {
      width: 100%;
      max-width: 410px;
      animation: authFadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes authFadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Elevated Glassmorphic Card */
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 2.25rem 2.25rem 2rem;
    }

    /* Card Header */
    .auth-header {
      text-align: center;
      margin-bottom: 1.6rem;
    }

    .auth-header-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 1rem;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.45);
    }

    .auth-header-icon svg {
      width: 24px;
      height: 24px;
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--color-text-heading);
      margin: 0 0 0.4rem 0;
    }

    .auth-subtitle {
      font-size: 0.875rem;
      color: var(--color-text-muted);
      margin: 0;
      line-height: 1.45;
    }

    /* Modern Segmented Tabs */
    .auth-segmented-control {
      position: relative;
      display: flex;
      background: rgba(0, 0, 0, 0.04);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      margin-bottom: 1.5rem;
    }

    [data-theme="dark"] .auth-segmented-control {
      background: rgba(255, 255, 255, 0.04);
    }

    .auth-seg-btn {
      flex: 1;
      padding: 0.6rem 0.85rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-text-muted);
      background: transparent;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      font-family: inherit;
    }

    .auth-seg-btn:hover {
      color: var(--color-text-heading);
    }

    .auth-seg-btn.active {
      background: var(--color-surface);
      color: var(--color-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    [data-theme="dark"] .auth-seg-btn.active {
      background: #1e293b;
      color: #818cf8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    /* Form Fields */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .auth-field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .auth-label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--color-text-heading);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .auth-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .auth-input-icon {
      position: absolute;
      left: 0.95rem;
      width: 18px;
      height: 18px;
      color: var(--color-text-dim);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
    }

    .auth-input-wrapper:focus-within .auth-input-icon {
      color: var(--color-primary);
    }

    .auth-input {
      width: 100% !important;
      height: 44px !important;
      padding: 0 2.75rem 0 2.75rem !important;
      font-family: inherit !important;
      font-size: 0.9375rem !important;
      color: var(--color-text-heading) !important;
      background-color: var(--input-bg) !important;
      border: 1px solid var(--input-border) !important;
      border-radius: 10px !important;
      outline: none !important;
      box-sizing: border-box !important;
      transition: all 0.2s ease !important;
    }

    .auth-input::placeholder {
      color: var(--color-text-dim) !important;
    }

    .auth-input:focus {
      border-color: var(--input-focus-border) !important;
      box-shadow: 0 0 0 3px var(--input-focus-ring) !important;
      background-color: var(--color-surface) !important;
    }

    .auth-pw-toggle {
      position: absolute;
      right: 0.65rem;
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      color: var(--color-text-dim);
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .auth-pw-toggle:hover {
      color: var(--color-text-heading);
      background-color: rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] .auth-pw-toggle:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    /* Submit Button */
    .auth-submit-btn {
      width: 100%;
      height: 44px;
      margin-top: 0.35rem;
      font-weight: 600;
      font-size: 0.9375rem;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .auth-submit-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
      transform: translateY(-1px);
    }

    .auth-submit-btn:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
    }

    .auth-submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Inline Loading Spinner */
    .auth-spinner {
      width: 18px;
      height: 18px;
      animation: authSpin 0.8s linear infinite;
    }

    @keyframes authSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Alert Banner */
    .auth-notice {
      padding: 0.75rem 0.9rem;
      border-radius: 10px;
      font-size: 0.8125rem;
      line-height: 1.45;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.35rem;
      animation: authAlertPop 0.2s ease;
    }

    @keyframes authAlertPop {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .auth-notice--danger {
      background-color: var(--color-danger-bg);
      border: 1px solid var(--color-danger);
      color: var(--color-danger);
    }

    .auth-notice--success {
      background-color: rgba(22, 163, 74, 0.1);
      border: 1px solid var(--color-success);
      color: var(--color-success);
    }

    /* Switcher Footer */
    .auth-footer {
      margin-top: 1.5rem;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-size: 0.84rem;
      color: var(--color-text-muted);
    }

    .auth-footer-link {
      background: none;
      border: none;
      color: var(--color-primary);
      font-weight: 600;
      font-size: 0.84rem;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
      transition: color 0.15s ease;
    }

    .auth-footer-link:hover {
      text-decoration: underline;
    }

    /* Trust & Security Tag */
    .auth-trust-badge {
      margin-top: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--color-text-dim);
      letter-spacing: 0.01em;
    }

    .auth-trust-badge svg {
      width: 14px;
      height: 14px;
      color: var(--color-success);
    }
  </style>
</head>
<body class="auth-view">

  <!-- Ambient Lighting Effect -->
  <div class="auth-ambient-blur" aria-hidden="true"></div>

  <!-- Minimalist Top Navigation -->
  <header class="auth-top-nav">
    <a href="index.html" class="auth-brand-group" title="AsmetNotes">
      <div class="auth-brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
        </svg>
      </div>
      <div class="auth-brand-text">
        <span class="brand-asmet">Asmet</span><span class="brand-notes">Notes</span>
      </div>
    </a>

    <div class="auth-nav-actions">
      <button id="theme-toggle-btn" class="auth-theme-btn" aria-label="Toggle dark mode" title="Toggle Light/Dark Theme">
        <span class="material-symbols-outlined text-xs" id="theme-toggle-icon">dark_mode</span>
      </button>
    </div>
  </header>

  <!-- Main Stage -->
  <main class="auth-center-stage">
    <div class="auth-container">
      
      <!-- Elevated Auth Card -->
      <div class="auth-card">
        
        <!-- Header -->
        <div class="auth-header">
          <div class="auth-header-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </div>
          <h2 id="auth-title" class="auth-title">Sign In</h2>
          <p id="auth-subtitle" class="auth-subtitle">Enter your email and password to access your notes</p>
        </div>

        <!-- Segmented Control: Sign In / Sign Up -->
        <div class="auth-segmented-control" role="tablist">
          <button type="button" class="auth-seg-btn active" id="tab-signin" role="tab" aria-selected="true">Sign In</button>
          <button type="button" class="auth-seg-btn" id="tab-signup" role="tab" aria-selected="false">Sign Up</button>
        </div>

        <!-- Alert Notification Banner -->
        <div id="auth-alert-box" class="auth-notice auth-notice--danger" hidden>
          <span class="material-symbols-outlined text-xs" id="auth-alert-icon">error</span>
          <span id="auth-alert-msg"></span>
        </div>

        <!-- Auth Form -->
        <form id="auth-form" class="auth-form" novalidate>
          
          <!-- Full Name (Only shown on Sign Up) -->
          <div class="auth-field" id="field-fullname" hidden>
            <label class="auth-label" for="auth-input-name">
              <span>Full Name</span>
              <span style="font-weight: 400; color: var(--color-text-dim); font-size: 0.75rem;">Optional</span>
            </label>
            <div class="auth-input-wrapper">
              <span class="auth-input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
              <input type="text" id="auth-input-name" class="auth-input" placeholder="Alex Morgan" autocomplete="name" />
            </div>
          </div>

          <!-- Email Address -->
          <div class="auth-field">
            <label class="auth-label" for="auth-input-email">Email Address</label>
            <div class="auth-input-wrapper">
              <span class="auth-input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
              </span>
              <input type="email" id="auth-input-email" class="auth-input" placeholder="name@example.com" required autocomplete="email" />
            </div>
          </div>

          <!-- Password -->
          <div class="auth-field" id="field-password">
            <label class="auth-label" for="auth-input-password">Password</label>
            <div class="auth-input-wrapper">
              <span class="auth-input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
              <input type="password" id="auth-input-password" class="auth-input" placeholder="Enter your password" required autocomplete="current-password" />
              <button type="button" id="auth-pw-toggle-btn" class="auth-pw-toggle" aria-label="Toggle password visibility">
                <span class="material-symbols-outlined text-xs" id="auth-pw-toggle-icon">visibility</span>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="auth-submit-btn" class="auth-submit-btn">
            <span id="auth-submit-spinner" hidden>
              <svg class="auth-spinner" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="32" stroke-linecap="round" />
              </svg>
            </span>
            <span id="auth-submit-text">Sign In</span>
          </button>
        </form>

        <!-- Footer Switcher -->
        <div class="auth-footer">
          <span id="auth-footer-prompt">Don't have an account?</span>
          <button type="button" id="auth-footer-btn" class="auth-footer-link">Sign Up</button>
        </div>

      </div>

      <!-- Trust & Security Subtitle -->
      <div class="auth-trust-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
        <span>End-to-end encrypted cloud sync with Supabase</span>
      </div>

    </div>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
